# Desktop only. Plain live-reloading config — edit and `hyprctl reload`.
# Deliberately not templated or generated: the save-and-reload loop is the
# whole point of Hyprland's config format.
#
# NOTE: do not copy this to a Fedora machine without checking the version.
# Fedora's hyprland package is orphaned (stuck at 0.45.2, absent from F43+)
# while Arch ships 0.55.x, and 0.55 removed/moved several options.

$mod = SUPER
bind = $mod, Return, exec, kitty
bind = $mod, Q, killactive
