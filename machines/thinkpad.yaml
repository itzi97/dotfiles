# Fedora ThinkPad — college machine. Reliability over elegance.
# Applied after install.conf.yaml. Bundles: see machines/thinkpad.bundles.
#
# (The header said "no Hyprland, no gaming config" until 2026-08-24. The
# Hyprland half is still true. The gaming half stopped being true when ADR-0015
# accepted gaming as a secondary use of this machine, and thinkpad.bundles has
# listed `gaming` since.)
#
# ---------------------------------------------------------------------------
# `mode: 755` DOES NOTHING IN DOTBOT. Do not add it expecting an effect.
#
# Verified 2026-08-24 against the vendored dotbot in dotbot/src/dotbot/plugins/
# link.py. The link plugin reads exactly these keys:
#
#   backup · canonicalize-path · create · exclude · force · glob · if
#   ignore-missing · link · path · prefix · relative · relink · type
#
# No `mode`, and no `chmod` call anywhere in the file. Unknown keys are ignored
# silently, which is how config/river/init came to be committed 644 while this
# file confidently declared 755 — river execs that file directly, so the result
# would have been a session with no keybindings at all, discovered at a login
# screen.
#
# WHAT ACTUALLY CARRIES THE BIT: git, on the source file in this repo. dotbot
# symlinks; a symlink has no mode of its own.
#
# SO WHY KEEP THESE LINES? Because bin/dotfiles-check reads them. Every entry
# declaring `mode: 755` is checked to confirm the source really is executable
# in the repo, and fails the commit if it is not. The key is an assertion aimed
# at the linter, not an instruction aimed at dotbot. Kept deliberately, and
# documented here so the next reader does not "discover" it is a no-op and
# delete the annotations the linter depends on.
# ---------------------------------------------------------------------------

- defaults:
    link:
      create: true
      relink: true
      force: false

- link:
    ~/.config/kitty/local.conf:   local/thinkpad/kitty-local.conf
    ~/.config/shell/local.sh:     local/thinkpad/local.sh
    ~/.config/fish/local.fish:    local/thinkpad/local.fish
    # config/git/config has ended with `[include] path = local` since it was
    # written, and nothing ever created the target. git tolerates a missing
    # include silently, so user.email was simply unset — and a stray
    # ~/.gitconfig quietly supplied it instead. Found 2026-08-21.
    ~/.config/git/local:          local/thinkpad/gitconfig

# `tbx` builds coursework containers from ~/.dotfiles/toolboxes/*.txt.
# Linked on the ThinkPad only — see ADR-0012.
- link:
    ~/.local/bin/tbx:
      path: bin/tbx
      mode: 755

# pkgwatch — the mitigation ADR-0016 depends on. Hand-downloaded RPMs (ProtonPass,
# Proton Authenticator) get no update notifications from anything else.
# ThinkPad-only for now because that's where the Tier A downloads live; add to
# desktop.yaml if anything there stops coming from a repo or the AUR.
- link:
    ~/.local/bin/pkgwatch:
      path: bin/pkgwatch
      mode: 755
    ~/.config/pkgwatch/watchlist.conf:            config/pkgwatch/watchlist.conf
    ~/.config/systemd/user/pkgwatch.service:      config/systemd/pkgwatch.service
    ~/.config/systemd/user/pkgwatch.timer:        config/systemd/pkgwatch.timer

# river — SECONDARY Wayland session. Plasma stays the SDDM default (ADR-0002's
# pattern, principle #2). Packages come from the `river` bundle, declared in
# machines/thinkpad.bundles. ThinkPad only for now: the desktop's compositor
# question is still open (06-backlog/open-questions.md §2).
- link:
    # init must be executable — river runs it directly, and a non-executable
    # init produces an empty session with no error worth reading.
    ~/.config/river/init:
      path: config/river/init
      mode: 755
    ~/.config/waybar/config.jsonc:  config/waybar/config.jsonc
    ~/.config/waybar/style.css:     config/waybar/style.css
    # The session wrapper. Sets the environment river's children need and then
    # execs river — config/river/init CANNOT do this, because it runs as
    # river's child and `spawn` inherits river's environment, not init's.
    # Verified 2026-08-23: every toolkit variable init exported read empty
    # inside the session.
    #
    # The matching session entry (config/river/river-session.desktop) is NOT
    # linked here — SDDM does not read ~/.local/share, so it needs a root
    # install to /usr/local/share/wayland-sessions. See the header of
    # bin/river-session for the command.
    ~/.local/bin/river-session:
      path: bin/river-session
      mode: 755
    # Owns the whole idle policy — the swayidle timings live here and nowhere
    # else, because they are needed both at session start and on every re-arm
    # after a pause. Bound to Super+Shift+I and driven by waybar's custom/idle.
    ~/.local/bin/river-idle:
      path: bin/river-idle
      mode: 755
    ~/.local/bin/river-cheatsheet:
      path: bin/river-cheatsheet
      mode: 755
    ~/.local/bin/river-wallpaper:
      path: bin/river-wallpaper
      mode: 755
    ~/.local/bin/install-nerd-font:
      path: bin/install-nerd-font
      mode: 755
    ~/.config/kanshi/config:        config/kanshi/config
    # KDE colour scheme DEFINITION. Note the split, which is the same one the
    # gtk-3.0 note below draws: the repo owns the scheme *file* (a static asset,
    # like the Nerd Font), the machine owns which scheme is *selected* — that
    # lives in ~/.config/kdeglobals, which Plasma rewrites from System Settings
    # and which therefore must never be a symlink into this repo.
    #
    # Applies to Dolphin, Ark, Okular, Gwenview and Plasma itself, in both
    # sessions, because both read kdeglobals. Apply it with:
    #   plasma-apply-colorscheme GruvboxDark
    ~/.local/share/color-schemes/GruvboxDark.colors:
      path: config/color-schemes/GruvboxDark.colors
    # Session theming — gruvbox everywhere it can be, Adwaita-dark for GTK
    # (see the note in gtk-3.0/settings.ini for why not gruvbox there).
    ~/.config/fuzzel/fuzzel.ini:    config/fuzzel/fuzzel.ini
    ~/.config/swaync/config.json:   config/swaync/config.json
    ~/.config/swaync/style.css:     config/swaync/style.css
    ~/.config/swaylock/config:      config/swaylock/config
    ~/.config/wlogout/layout:       config/wlogout/layout
    ~/.config/wlogout/style.css:    config/wlogout/style.css
    # Portal backend selection. XDG_CURRENT_DESKTOP=river means
    # xdg-desktop-portal looks for river-portals.conf and finds nothing —
    # Fedora ships sway-portals.conf and hyprland-portals.conf but no river
    # one, because river-classic is not a distro-blessed session. Without it
    # the portal has no idea which implementation to load.
    ~/.config/xdg-desktop-portal/river-portals.conf:
      path: config/xdg-desktop-portal/river-portals.conf
    # Starting this target is what tells systemd the graphical session has
    # begun, which is what xdg-desktop-portal.service is ordered after.
    ~/.config/systemd/user/river-session.target:
      path: config/systemd/river-session.target

# GTK settings.ini is deliberately NOT linked.
#
# dotbot refused to overwrite the existing files (force: false, working as
# designed) and inspecting them showed why that was the right outcome: Plasma
# had already written coherent dark config — prefer-dark, Breeze, breeze-dark
# icons — plus `gtk-xft-dpi=122880`, a machine-specific 120 DPI value that a
# checked-in file would have silently destroyed.
#
# Plasma is the default session and owns these files; it also rewrites them
# from its settings module, which would either replace a symlink or write
# straight through it into this repo. river simply inherits them, and sets
# only the colour-scheme preference (config/river/init) for GTK4 apps that
# read the portal rather than settings.ini.
#
# If river ever becomes the default session, revisit — at that point nothing
# else is maintaining these and they should come into the repo.

- shell:
    - command: systemctl --user daemon-reload && systemctl --user enable --now pkgwatch.timer
      stdout: true
      stderr: true
      description: Enable the monthly pkgwatch timer

    # Nerd Font symbols. Fedora packages none, so this is the documented
    # exception to "if it's part of the setup it goes in a package list"
    # (03-conventions/dotfiles.md) — a static asset with no update story,
    # fetched by a committed script so a rebuild reproduces it.
    #
    # --check first so the download only happens when it is actually missing;
    # bootstrap.sh runs often and should not hit GitHub every time.
    - command: bin/install-nerd-font --check >/dev/null 2>&1 || bin/install-nerd-font
      stdout: true
      stderr: true
      description: Install Nerd Font symbols if missing
