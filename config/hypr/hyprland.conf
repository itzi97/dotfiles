# ~/.config/hypr/hyprland.conf  (linked from ~/.dotfiles/config/hypr/hyprland.conf)
#
# Hyprland session for the ThinkPad — ADR-0023. Third session: Plasma stays
# the SDDM default (principle #2), river stays configured as the reliable
# tiler. Hyprland comes from the sachesi/hyprland COPR (vetted 2026-08-25,
# ADR-0023 records the trust reasoning) — if that repo dies, log into river
# and lose only the eye candy. Nothing in here may become load-bearing until
# the COPR survives a Fedora release upgrade.
#
# TRANSLATED FROM config/river/init. The master layout is deliberately the
# closest thing Hyprland has to rivertile/xmonad: main area + stack, mfact,
# master count, orientation. Every binding keeps its river muscle memory;
# differences are commented at the binding.
#
# Colour grammar per ADR-0021: #d79921 selected/focused, #fb4934 act-now,
# everything else recedes. Same values as waybar, fuzzel, swaync, swaylock,
# wlogout and kitty.

# --- environment ------------------------------------------------------------
# Unlike river, Hyprland sets env natively BEFORE spawning anything, so the
# river-session wrapper's whole reason to exist doesn't apply here. Same
# values, same rationale (see bin/river-session for the war stories).
env = QT_QPA_PLATFORM,wayland
# `kde`, not qt6ct: plasma-integration is installed on this machine and
# kdeglobals is the single source of truth for Qt theming in BOTH sessions.
# river-session probes for the plugin; this file is ThinkPad-specific config
# so it states the answer instead. If Dolphin ever renders grey here, check
# that KDEPlasmaPlatformTheme6.so still exists (see river-session's probe).
env = QT_QPA_PLATFORMTHEME,kde
env = MOZ_ENABLE_WAYLAND,1
env = _JAVA_AWT_WM_NONREPARENTING,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = XCURSOR_THEME,breeze_cursors
env = XCURSOR_SIZE,24

# --- monitor ----------------------------------------------------------------
# Native monitor config, NOT kanshi. Hyprland owns its outputs; running kanshi
# alongside would be two writers to one resource. kanshi remains river's
# output manager (river 0.3 has none of its own — different situation).
# Same 1.25 scale as config/kanshi/config, same reasoning (191 DPI panel,
# matches Plasma's 120 DPI compensation).
monitor = eDP-1, preferred, auto, 1.25
# Anything hotplugged (projector): sane default until configured deliberately.
monitor = , preferred, auto, 1

# --- input ------------------------------------------------------------------
input {
    # Spanish layout — same hard requirement as river's `keyboard-layout es`,
    # same failure mode without it (every symbol in the wrong place).
    kb_layout = es

    repeat_rate = 50
    repeat_delay = 300

    # river: focus-follows-cursor normal
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        # tap-to-click and disable-while-typing are Hyprland defaults (on),
        # matching river's explicit settings.
    }
}

# --- appearance (ADR-0021 grammar) ------------------------------------------
general {
    layout = master

    border_size = 2
    col.active_border = rgb(d79921)      # the accent
    col.inactive_border = rgb(504945)    # bg2 — passive edge
    # No urgent border colour setting exists in Hyprland's general section;
    # urgency shows in the bar (red workspace) instead.

    # Session spacing unit is 6 (ADR-0021). First translation used 3/6 on the
    # theory that rivertile's view-padding 6 meant 6px between windows — wrong:
    # rivertile pads EACH view, so neighbours sat ~12px apart and edges at 12.
    # Confirmed by eye on first login ("gaps too small"). gaps_in applies per
    # window edge (neighbours = 2×), so 6/12 reproduces the river look and
    # stays on the rhythm (12 breathes).
    gaps_in = 6
    gaps_out = 12
}

master {
    # xmonad semantics, matching the river setup: main-ratio 0.55, one view
    # in main, main on the left, and a NEW window takes the main area (river
    # attach-mode top + rivertile put new views in main; xmonad does the same).
    mfact = 0.55
    orientation = left
    new_status = master
}

decoration {
    # rounding stays 0 — DELIBERATE, and the one eye-candy lever not pulled.
    # Every other surface in the session (fuzzel, swaync, wlogout, waybar) is
    # square per ADR-0021; round windows against square chrome reads as two
    # design systems. If rounding is ever wanted, it happens as one change
    # across all surfaces, not here alone.
    rounding = 0

    # Blur and shadows: the reasons this session exists. Restrained values —
    # the grammar's job is a quiet surface where state changes land.
    blur {
        enabled = true
        size = 6
        passes = 3
    }

    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = rgba(00000066)
    }
}

animations {
    enabled = true
    # Fast and small: animation should confirm what happened, not perform.
    # Durations are deciseconds — these are 150–250ms.
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = windows, 1, 2, ease, popin 90%
    animation = fade, 1, 2, ease
    animation = border, 1, 3, ease
    animation = workspaces, 1, 3, ease, slide
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    # bg0 behind everything, matching river's background-color — visible only
    # before river-wallpaper --restore paints, or if it has nothing saved.
    background_color = rgb(282828)
}

# Blur behind fuzzel and swaync so the effect reaches the session's own
# chrome, not just windows. BLOCK SYNTAX — Hyprland 0.53 (Dec 2025)
# overhauled windowrule AND layerrule; the old one-liners fail to parse on
# the 0.56 this session runs. Namespaces to VERIFY on the machine with
# `hyprctl layers` once running — "launcher" is fuzzel's documented
# namespace; swaync's two are its conventional ones. A wrong namespace
# fails silently (no blur, nothing broken).
layerrule {
    name = blur-launcher
    match:namespace = launcher
    blur = true
}
# NO swaync layerrule, and the reasoning is worth keeping (first-login
# finding, 2026-08-25): swaync's notification layer surface is a tall,
# mostly-transparent strip — blurring it painted a giant frosted slab under
# the visible cards. And the cards themselves are opaque #282828 in the
# SHARED stylesheet (river renders them too, and river cannot blur), so a
# swaync blur rule can never show glass — it can only show artifacts. If
# swaync ever goes translucent, it needs a hyprland-only stylesheet first,
# and ignore_alpha on the rule.

# --- smart gaps: one window → no gaps, no border ----------------------------
# The wideriver feature (ADR-0022), native here. w[tv1] = exactly one tiled
# visible window, f[1] = a maximized window. This is VERBATIM the recipe from
# Hyprland's own post-0.53 default config (confirmed working in upstream
# discussion #12797) — not adapted, because the 0.53 syntax overhaul is
# exactly where adapted-from-memory rules go to die.
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule {
    name = no-gaps-wtv1
    match:float = false
    match:workspace = w[tv1]

    border_size = 0
    rounding = 0
}
windowrule {
    name = no-gaps-f1
    match:float = false
    match:workspace = f[1]

    border_size = 0
    rounding = 0
}

# --- window rules -----------------------------------------------------------
# Same set as river's rule-add block: dialogs pretending to be windows.
# Post-0.53 syntax: match:class regex, then the property. pavucontrol's
# app-id grew an org.pulseaudio. prefix in newer releases, so match both —
# the river rule's bare glob is likely stale for the same reason.
windowrule = match:class ^(org.pulseaudio.)?pavucontrol$, float on
windowrule = match:class ^(floatterm)$, float on
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(org.kde.polkit-kde-authentication-agent-1)$, float on
windowrule = match:class ^(scratchpad)$, float on

# kitty glass — SESSION-SCOPED opacity, deliberately not kitty.conf.
# kitty.conf is shared with the desktop and its 0.96 was chosen for
# unblurred backgrounds; this rule multiplies compositor-side, so only the
# Hyprland session (the one with blur) goes more transparent. Effective
# opacity ≈ 0.96 (kitty) × 0.88 (this rule) ≈ 0.85. Tune the 0.88 here,
# never the kitty.conf value.
windowrule = match:class ^(kitty|scratchpad)$, opacity 0.88

# --- core keybinds — xmonad, same as river ----------------------------------
$mod = SUPER

bind = $mod SHIFT, Return, exec, kitty
bind = $mod, P, exec, fuzzel
bind = $mod SHIFT, C, killactive
bind = $mod SHIFT, Q, exit

# Focus and swap — j/k through the master stack, honouring the layout.
bind = $mod, J, layoutmsg, cyclenext
bind = $mod, K, layoutmsg, cycleprev
bind = $mod SHIFT, J, layoutmsg, swapnext
bind = $mod SHIFT, K, layoutmsg, swapprev

# Resize the main area — h/l, xmonad style.
bind = $mod, H, layoutmsg, mfact -0.05
bind = $mod, L, layoutmsg, mfact +0.05

# How many views share the main area — comma/period.
bind = $mod, comma, layoutmsg, addmaster
bind = $mod, period, layoutmsg, removemaster

# Promote to main — the wiki itself calls this "xmonad's promote".
bind = $mod, Return, layoutmsg, swapwithmaster master

# Where the main area sits.
bind = $mod, Up, layoutmsg, orientationtop
bind = $mod, Right, layoutmsg, orientationright
bind = $mod, Down, layoutmsg, orientationbottom
bind = $mod, Left, layoutmsg, orientationleft

bind = $mod, F, fullscreen, 0
bind = $mod, T, togglefloating
bind = $mod SHIFT, Space, togglefloating

# Mouse: move and resize floating windows.
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# --- workspaces (river tags 1–9 become workspaces 1–9) ----------------------
# WHAT DOES NOT TRANSLATE, honestly: workspaces are not a bitmask. river's
# Super+Ctrl+N (toggle a tag into view) and Super+Shift+Ctrl+N (toggle a tag
# on a window) and Super+0 (show all tags) have no Hyprland equivalent and
# are deliberately unbound rather than approximated badly. If multi-view
# turns out to be a real loss, that's evidence for the river column in the
# ADR-0023 review, not something to fake here.
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
# Move window there without following — river's set-view-tags behaviour.
bind = $mod SHIFT, 1, movetoworkspacesilent, 1
bind = $mod SHIFT, 2, movetoworkspacesilent, 2
bind = $mod SHIFT, 3, movetoworkspacesilent, 3
bind = $mod SHIFT, 4, movetoworkspacesilent, 4
bind = $mod SHIFT, 5, movetoworkspacesilent, 5
bind = $mod SHIFT, 6, movetoworkspacesilent, 6
bind = $mod SHIFT, 7, movetoworkspacesilent, 7
bind = $mod SHIFT, 8, movetoworkspacesilent, 8
bind = $mod SHIFT, 9, movetoworkspacesilent, 9

# --- scratchpad -------------------------------------------------------------
# river used tag 10 as an overlay; Hyprland has the concept natively as the
# special workspace. Same keys, same behaviour: floats over the current
# workspace, vanishes without changing where you are.
bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspacesilent, special:magic

# --- hardware keys ----------------------------------------------------------
# bindle = repeats while held + works at the lock screen; bindl = locked only.
# Through bin/osd (first-login feedback, 2026-08-25): same wpctl/brightnessctl
# effects as river's direct calls, plus a self-replacing progress notification
# so the keys answer on screen, not just in the waybar corner.
bindle = , XF86AudioRaiseVolume, exec, $HOME/.local/bin/osd volume-up
bindle = , XF86AudioLowerVolume, exec, $HOME/.local/bin/osd volume-down
bindl = , XF86AudioMute, exec, $HOME/.local/bin/osd volume-mute
bindl = , XF86AudioMicMute, exec, $HOME/.local/bin/osd mic-mute
bindle = , XF86MonBrightnessUp, exec, $HOME/.local/bin/osd bright-up
bindle = , XF86MonBrightnessDown, exec, $HOME/.local/bin/osd bright-down
bindl = , XF86AudioMedia, exec, playerctl play-pause

# --- screenshots ------------------------------------------------------------
# grim/slurp/swappy, same as river — Hyprland speaks screencopy, and one
# tool per job says no hyprshot while these work.
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy
bind = $mod, Print, exec, mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png

# --- session ----------------------------------------------------------------
bind = $mod, Escape, exec, swaylock
bind = $mod SHIFT, P, exec, wlogout
bind = $mod, V, exec, cliphist list | fuzzel --dmenu --width 64 --prompt "󰅍 clip ❯ " | cliphist decode | wl-copy
# Absolute paths for the same reason river uses them: a binding that works
# without depending on PATH being right is worth more than the symmetry.
bind = $mod SHIFT, H, exec, $HOME/.local/bin/hypr-cheatsheet
bind = $mod, W, exec, $HOME/.local/bin/river-wallpaper
bind = $mod SHIFT, I, exec, $HOME/.local/bin/river-idle toggle

# --- autostart --------------------------------------------------------------
# Everything river's init started, minus kanshi (native monitor config above)
# and minus the singleton wrapper: exec-once runs once per session and
# `hyprctl reload` does not re-run it, so the stacking-daemons failure that
# forced river's run() cannot happen here.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE PATH

# Secret Service for Signal/Element/libsecret. The daemon registers on D-Bus,
# which is how apps find it — no env export needed for that part. (SSH agent
# env is the one gap; add it deliberately if ssh-agent-via-keyring is wanted
# in this session.)
exec-once = gnome-keyring-daemon --start --components=secrets,ssh

# polkit agent — without it, auth prompts fail silently (river's lesson).
exec-once = /usr/libexec/polkit-kde-authentication-agent-1

# GTK4/libadwaita dark mode via the portal, same one-setting-only rule as
# river: theme/icons/cursor stay Plasma's.
exec-once = gsettings set org.gnome.desktop.interface color-scheme prefer-dark

exec-once = hyprctl setcursor breeze_cursors 24

# Waybar with the Hyprland module config; stylesheet is SHARED with the
# river session so the grammar cannot drift between the two bars.
exec-once = waybar -c ~/.config/waybar/hyprland.jsonc -s ~/.config/waybar/style.css

exec-once = swaync
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = $HOME/.local/bin/river-wallpaper --restore
exec-once = wl-paste --watch cliphist store

# Idle policy: same single source of truth as river (bin/river-idle), so the
# two sessions cannot disagree about when the laptop locks.
exec-once = $HOME/.local/bin/river-idle start

# The OSD bar (wob) behind bin/osd's volume/brightness popups. A named pipe
# feeds it; bin/osd writes values in, with a timeout guard so a dead wob
# degrades the keys to notifications instead of hanging them. rm first: a
# leftover pipe from a crashed session would make mkfifo fail and take wob
# down with it.
exec-once = rm -f $XDG_RUNTIME_DIR/wob.sock; mkfifo $XDG_RUNTIME_DIR/wob.sock; tail -f $XDG_RUNTIME_DIR/wob.sock | wob -c ~/.config/hypr/wob.ini

# The scratchpad terminal, parked in the special workspace from the start —
# no focus dance needed, unlike river's spawn-while-focused workaround.
exec-once = [workspace special:magic silent] kitty --class scratchpad
