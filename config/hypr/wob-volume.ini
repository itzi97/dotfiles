# ~/.config/hypr/wob-volume.ini  (linked via the ~/.config/hypr directory link)
#
# The VOLUME gauge — a hard-edged amber bar, bottom centre, in the spirit of
# an amber-phosphor readout. wob draws exactly one rectangle with no
# antialiasing and no icons, which is not a limitation here: it IS the
# retro-futurist aesthetic, arrived at by subtraction.
#
# Grammar (ADR-0021): the bar is the CURRENT value, so it takes the accent.
# Border is a passive edge (bg2), ground is bg0_h with slight translucency.
# Muted drops the bar to ambient gray — state change by receding, exactly
# like the waybar wireplumber module.
#
# Lives in config/hypr/ because that directory is linked wholesale; if the
# river session ever adopts the same OSD, promote this to config/wob/ and
# add the link.

timeout = 900
max = 100

# Wide and low, floating clear of the screen edge. Volume is HORIZONTAL,
# bottom centre; brightness is a separate vertical wob on the right edge
# (wob-brightness.ini). The gauges are told apart by geometry and position,
# cockpit-style — wob cannot draw icons, and it turns out none are needed.
# border_offset is the gap between border and bar — the inset that makes it
# read as a gauge, not a progress toast.
width = 360
height = 26
border_offset = 3
border_size = 2
bar_padding = 3
anchor = bottom center
margin = 48

border_color = 504945FF
background_color = 1d2021E6
bar_color = d79921FF

# Selected per message: bin/osd sends "55 muted" when the sink is muted.
[style.muted]
border_color = 504945FF
background_color = 1d2021E6
bar_color = 928374FF
