# ~/.config/hypr/wob-brightness.ini  (linked via the ~/.config/hypr directory link)
#
# The BRIGHTNESS gauge — a vertical amber column rising up the right edge of
# the screen, a light-level thermometer. Its own wob instance on its own pipe
# (wob-bri.sock, see hyprland.conf); the volume gauge is the horizontal bar
# at bottom centre. Position and orientation are what tell the two apart —
# same amber, same grammar, different geometry.

timeout = 900
max = 100

# Tall and narrow. In vertical orientation wob still reads width/height
# literally, so height >> width.
width = 26
height = 240
orientation = vertical
border_offset = 3
border_size = 2
bar_padding = 3
anchor = right center
margin = 48

border_color = 504945FF
background_color = 1d2021E6
bar_color = d79921FF
