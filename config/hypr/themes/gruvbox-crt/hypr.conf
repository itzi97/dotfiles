# config/hypr/themes/gruvbox-crt/hypr.conf
#
# THEME: gruvbox-crt — amber phosphor, 1980s vision of the future.
#
# Sourced by hyprland.conf via ~/.local/state/hypr-theme/current.conf.
# This file owns appearance and layout OUTRIGHT: general, master, decoration,
# animations and the background colour appear here and NOWHERE in
# hyprland.conf. That is deliberate — if both files set them, the session's
# look would depend on Hyprland's linear parse order, and "one authoritative
# home per fact" (03-conventions) would be a comment rather than a fact.
#
# Colour grammar is ADR-0021, unchanged: #d79921 selected/focused/current,
# #fb4934 act-now, #fe8019 attend-soon, everything else recedes.
#
# MOTION: the brief is a machine that is fast and slightly mechanical — a
# relay closing, phosphor decaying — not a phone animating. Durations are
# deciseconds; everything here is 120–240ms. No continuous-repaint effects
# (no borderangle loop): this laptop runs on a battery, and that constraint
# is what separates this theme from neon-sprawl rather than an oversight.

general {
    layout = master

    border_size = 2
    # The accent with a sheen: full amber fading to its own half-alpha self at
    # 45°. The fade IS #d79921, so the grammar stays one-accent.
    col.active_border = rgb(d79921) rgba(d7992180) 45deg
    col.inactive_border = rgb(504945)

    # Session spacing unit is 6 (ADR-0021). gaps_in applies per window edge,
    # so neighbours sit 12px apart — 6/12 is the rhythm, not a coincidence.
    gaps_in = 6
    gaps_out = 12
}

master {
    # xmonad semantics, matching river: main area left, new window takes main.
    mfact = 0.55
    orientation = left
    new_status = master
}

decoration {
    # Square, and staying square. Every other surface in this theme (fuzzel,
    # swaync, wlogout, waybar) is square per ADR-0021; round windows against
    # square chrome reads as two design systems.
    rounding = 0

    blur {
        enabled = true
        size = 6
        passes = 3
    }

    shadow {
        enabled = true
        range = 14
        render_power = 3
        # Warm amber-black. At ~15% alpha this reads as faint phosphor bloom
        # around every window — a CRT glow that costs nothing, because it is
        # static and never repaints.
        color = rgba(d7992126)
    }
}

animations {
    enabled = true

    # `relay`: a fast approach that overshoots a hair and settles. This is the
    # theme's signature — a mechanical switch closing, not a spring bouncing.
    # The overshoot is 1.05, small enough to feel like mass rather than bounce.
    bezier = relay, 0.20, 0.90, 0.10, 1.05
    # `phosphor`: fast out, long tail — how a CRT dot actually decays. Used for
    # every fade so that things LEAVE more slowly than they arrive, which is
    # the opposite of the usual default and is most of why this reads as CRT.
    bezier = phosphor, 0.40, 0.00, 0.20, 1.00

    # Windows snap in at 92% — the scale is small enough to read as a scanline
    # settling rather than a zoom.
    animation = windows,     1, 2, relay,    popin 92%
    animation = windowsOut,  1, 2, phosphor, popin 96%
    animation = fade,        1, 2, phosphor
    animation = border,      1, 3, relay
    # A short horizontal wipe — changing channels, not swiping a phone.
    animation = workspaces,  1, 3, relay,    slidefade 15%
    # The scratchpad drops from the top and retracts the same way, matching
    # where its window is parked (just under the bar).
    animation = specialWorkspace, 1, 3, relay, slidefadevert -50%
    animation = layers,      1, 2, phosphor, fade
}

misc {
    # bg0, matching river's background — visible only before
    # river-wallpaper --restore paints, or if it has nothing saved.
    background_color = rgb(282828)
}
