# config/hypr/themes/neon-sprawl/hypr.conf
#
# THEME: neon-sprawl — cyan and magenta, wet asphalt, too many signs.
#
# Sourced by hyprland.conf via ~/.local/state/hypr-theme/current.conf.
# Owns general, master, decoration, animations and the background colour
# outright — same rule as gruvbox-crt, same reason.
#
# THE GRAMMAR IS NOT ABANDONED, IT IS RE-INSTANTIATED. ADR-0021's rule is
# structural, not chromatic: an accent means CURRENT and nothing else may look
# like it; exactly one colour means act-now; one means attend-soon; everything
# else recedes. This theme keeps that shape and swaps the values:
#
#   #00e5ff  selected / focused / current      (was #d79921)
#   #ff2e6c  act now                           (was #fb4934)
#   #ffb800  attend soon                       (was #fe8019)
#   #d7e0ff  content   #7a86b8  secondary
#   #3a4160  ambient chrome                    #1e2130  passive edges
#
# A theme that kept the grammar's *values* would just be a recolour; one that
# dropped the grammar would go back to the incoherence ADR-0021 was written
# to fix. Same skeleton, different body.
#
# THIS THEME COSTS BATTERY, ON PURPOSE. borderangle below is a continuous
# repaint — the exact effect gruvbox-crt refuses on those grounds. That was a
# deliberate choice (2026-08-26): cyberpunk without a live neon edge is just
# blue gruvbox. Switch to gruvbox-crt when unplugged and it stops immediately.

general {
    layout = master

    # Thicker: the border is a light source in this theme, not a hairline.
    border_size = 3
    # Cyan into magenta. The gradient is two hues, which gruvbox-crt
    # deliberately refuses — here the sign IS two-tone, and the accent is the
    # pair. Nothing else in the theme uses magenta except act-now, which is a
    # different, hotter magenta (#ff2e6c) at a size you cannot confuse with a
    # 3px edge.
    col.active_border = rgb(00e5ff) rgb(b026ff) 45deg
    col.inactive_border = rgb(1e2130)

    gaps_in = 4
    gaps_out = 16
}

master {
    # THE ORGANISATIONAL DIFFERENCE. `center` puts the focused window in the
    # middle with the stack split across BOTH flanks — a console with wings
    # rather than a page with a sidebar.
    #
    # Deliberately still the MASTER layout and not dwindle: every keybind in
    # hyprland.conf is shared between themes, and master-specific dispatchers
    # (layoutmsg swapwithmaster, orientationcycle) would silently do nothing
    # under dwindle. Changing orientation gets a genuinely different
    # organisation while every binding keeps working.
    mfact = 0.60
    orientation = center
    new_status = master
    # Only centre once there is something to flank it with; with a single
    # slave, centre orientation wastes half the screen.
    slave_count_for_center_master = 2
}

decoration {
    # Still square, and this is not laziness. Cyberpunk's visual language is
    # angular — chamfers and hard edges, not soft corners — so the session's
    # existing square rule and the theme's brief happen to agree. It also
    # means chrome (waybar, fuzzel, swaync) needs no per-theme corner logic.
    rounding = 0

    # Heavy. Rain on glass, not a frosted pane.
    blur {
        enabled = true
        size = 10
        passes = 4
        # Slightly brighter and more saturated behind the blur, so wallpaper
        # colour bleeds through chrome instead of going grey.
        brightness = 1.10
        vibrancy = 0.35
    }

    shadow {
        enabled = true
        range = 26
        render_power = 4
        # Cyan bloom — the window is lit from inside, like a sign at night.
        color = rgba(00e5ff33)
    }
}

animations {
    enabled = true

    # `glide`: long, heavily eased, no overshoot. Things move like they have
    # inertia and no friction.
    bezier = glide,    0.16, 1.00, 0.30, 1.00
    # `snap`: overshoots properly (1.15) — a HUD element slamming into place.
    bezier = snap,     0.05, 0.90, 0.10, 1.15
    # `sign`: near-linear, for the border loop, so the gradient rotates at a
    # constant rate instead of pulsing.
    bezier = sign,     0.00, 0.00, 1.00, 1.00

    # Longer than gruvbox-crt across the board — 300–500ms against its
    # 200–300ms. This theme performs; that is the point of having two.
    # (borderangle's 60 is a 6-SECOND rotation, not a transition.)
    animation = windows,     1, 4, snap,  popin 80%
    animation = windowsOut,  1, 4, glide, popin 85%
    animation = fade,        1, 4, glide
    animation = border,      1, 5, glide
    # THE EXPENSIVE ONE. Rotates the cyan→magenta gradient around the focused
    # window continuously. This is the battery cost named in the header: it
    # never stops while a window is focused.
    animation = borderangle, 1, 60, sign, loop
    # A full vertical throw rather than a wipe — riding a lift between floors.
    animation = workspaces,  1, 5, glide, slidevert
    animation = specialWorkspace, 1, 4, snap, slidefadevert -50%
    animation = layers,      1, 3, glide, slidefade -20%
}

misc {
    # Near-black with a blue cast. Pure #000 reads as "monitor off"; this
    # reads as night.
    background_color = rgb(0a0b10)
}
