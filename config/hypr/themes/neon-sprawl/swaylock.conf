# config/hypr/themes/neon-sprawl/swaylock.conf
#
# Lock screen, neon-sprawl variant. Passed with `swaylock -C` from the
# Hyprland session's bind; the river session and bin/river-idle keep
# ~/.config/swaylock/config and stay gruvbox (ADR-0026).
#
# GENERATED FROM config/swaylock/config BY VALUE SUBSTITUTION, deliberately.
# swaylock's load_config() ABORTS AT THE FIRST UNRECOGNISED LINE and silently
# ignores everything after it — that is the 2026-08-24 bug where `indicator`
# was not a mainline option and every colour below line 19 never loaded. So
# this file carries the SAME KEYS IN THE SAME ORDER as the known-good config
# and changes only values. If you add an option here, add it there first and
# confirm the lock screen still renders.
#
#   282828 -> 0a0b10   bg            504945 -> 1e2130   passive ring
#   ebdbb2 -> d7e0ff   content       d79921 -> 00e5ff   verifying (accent)
#   fb4934 -> ff2e6c   wrong         fe8019 -> ffb800   backspace
#   665c54 -> 3a4160   clearing
color=0a0b10
indicator-radius=90
indicator-thickness=8
indicator-idle-visible
indicator-caps-lock
ring-color=1e2130
inside-color=0a0b10
line-color=0a0b10
text-color=d7e0ff
separator-color=00000000
ring-ver-color=00e5ff
inside-ver-color=0a0b10
line-ver-color=0a0b10
text-ver-color=d7e0ff
key-hl-color=d7e0ff
bs-hl-color=ffb800
ring-wrong-color=ff2e6c
inside-wrong-color=0a0b10
line-wrong-color=0a0b10
text-wrong-color=ff2e6c
ring-clear-color=3a4160
inside-clear-color=0a0b10
line-clear-color=0a0b10
text-clear-color=d7e0ff
hide-keyboard-layout
font=JetBrains Mono
font-size=20
ignore-empty-password
