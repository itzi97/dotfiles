# config/hypr/themes/neon-sprawl/fuzzel.ini
#
# Launcher, clipboard picker and the fuzzel-dmenu menus, neon-sprawl variant.
# Passed with `fuzzel --config=` from hyprland.conf's binds, so the RIVER
# session keeps ~/.config/fuzzel/fuzzel.ini and stays gruvbox (ADR-0026).
#
# Grammar per ADR-0021, re-instantiated: selection takes the accent, and
# nothing else is allowed to look like it.
#
# FUZZEL IS AN INI, NOT CSS — there is no shadow, gradient or per-side border
# here, so it cannot carry the aberration/bracket language the GTK surfaces
# use. The levers that exist are colour, border weight, padding and the prompt
# string, and the prompt is doing most of the work: "//RUN█" is a terminal
# cursor, which is the cyberpunk cue available in plain text.
#
# It has three levers the previous version did not know about, all confirmed
# in fuzzel.ini(5): `letter-spacing` (pt by default, px with a suffix),
# `line-height`, and `use-bold`. They are the whole of the type treatment
# available here, and two of the three are used below.
#
# KEY COVERAGE WAS SHORT BY FIVE, AND ONE OF THEM WAS FUNCTIONAL. This file
# was hand-written and dropped `counter` from [colors] and the entire [dmenu]
# and [key-bindings] sections — so Control+k / Control+j did nothing in the
# Hyprland session's launcher while working in river's, from what is supposed
# to be the same launcher. That is the fifth hand-written file to lose keys
# (swayosd.css: 4 selectors, swaync.css: 13 then a broken comment, kitty.conf:
# the local include, and now this). Restored below and checked by diffing the
# key list against config/fuzzel/fuzzel.ini.
#
# Verified rather than assumed, because each was a plausible guess:
#   - [colors] keys drop the CLI `-color` suffix: it is `match`, not
#     `match-color`; `prompt`, not `prompt-color`. `prompt` therefore names
#     two different things in two sections — a string in [main], a colour here.
#   - Colours are exactly 8 hex digits. A 6-digit value is REJECTED outright,
#     not defaulted.
#   - An unrecognised key costs only that line: fuzzel logs it and carries on.
#     This is the opposite of swaylock, which abandons the rest of the file.
#     `fuzzel --check-config` turns those warnings fatal — use it after edits.
#   - An unrecognised SECTION header discards every key inside it silently, so
#     `[color]` for `[colors]` loses the whole block with one message.
#   - No pango markup: fuzzel renders through fcft, not pango. `<b>` would
#     print literally. Arbitrary UTF-8 is fine, which is what makes █ work.
#
# NOTE the dmenu pickers do NOT get this prompt. hypr-cheatsheet, the wallpaper
# menu and `hypr-theme menu` pass their own --prompt on the command line, so
# those strings live in the scripts and are shared across both themes.

# ADWAITA MONO, NOT JETBRAINS MONO — the theme's own face, on every surface it
# owns. ADR-0021 fixed one font stack for the RIVER session; this theme
# re-instantiates that ADR's grammar, not its values, exactly as it does with
# the palette. Keeping the typeface identical was habit, not reasoning: two
# themes in the same face are two palettes, which is the complaint.
#
# Adwaita Mono is Iosevka-derived — narrow, geometric, flat-terminalled — where
# JetBrains Mono is humanist and round. That is a different voice rather than a
# different label. Chosen from `fc-list :spacing=100` on this machine, not from
# memory: fontconfig NEVER errors on a missing family, it silently substitutes,
# so a face that is not installed looks like a face that did not apply.
#
# Deliberately not a "cyberpunk" display face. The condensed/techy ones are the
# single type decision with clear evidence against them at this size — Sawyer et
# al. measured condensed text 11.2% slower to read — and a launcher is read
# under time pressure or it is not doing its job.
#
# gruvbox-crt stays on JetBrains Mono, and not only for contrast: its
# fuzzel.ini, swaylock.conf and kitty.conf are SYMLINKS to river's, so giving it
# a face of its own would either split the theme across two typefaces or drag
# river with it.
font=Adwaita Mono:size=11
dpi-aware=auto
prompt="//RUN█"

# --- geometry: a console dropping from the top edge, not a card in the middle -
#
# THIS IS THE STRUCTURAL DIFFERENCE, and until 2026-08-27 there wasn't one — the
# two launchers were the same centred box in two palettes, which is exactly the
# "recolour, not a redesign" ADR-0026 was written against. The shared config
# (river's, and gruvbox-crt's by symlink) stays a centred 50ch card at
# anchor=center; this one is a wide readout pinned under the bar.
#
# anchor + y-margin verified in fuzzel.ini(5): y-margin has no effect at
# anchor=center|left|right, and DOES at top. 52px clears the 42px bar plus the
# 16px outer gap hypr.conf sets, so the panel hangs off the bar rather than
# floating loose.
# ASYMMETRY IS THE POINT, and it is the device the FUI/HUD literature rates
# highest — scale-free, and the only one on the list that can carry state. A
# panel centred on the screen is a dialog no matter what colour it is; a panel
# welded into one corner is instrumentation. x-margin 16 matches hypr.conf's
# gaps_out exactly, so it lines up with the window edge below it rather than
# floating near it, and y-margin 52 clears the 42px bar plus that same gap.
#
# Both margins verified against fuzzel.ini(5): x-margin has no effect at
# anchor=center|top|bottom, y-margin none at center|left|right. top-left is the
# one anchor where BOTH apply, which is why it is top-left and not top.
anchor=top-left
x-margin=16
y-margin=52
# 64ch, matching the picker convention ADR-0021 set for the cheat sheet and the
# wallpaper menu — the launcher joins them instead of being the one narrow one.
width=64
# Fewer rows than gruvbox's 14, and taller ones. A short deep readout reads as
# instrumentation; fourteen thin rows read as a list.
lines=9
line-height=26px
horizontal-pad=28
vertical-pad=12
inner-pad=10

# OPENS AS A PROMPT, NOT AS A LIST. With this set, the panel is a single input
# strip until the first keystroke, then unfolds to nine rows. It is the biggest
# behavioural difference available here and it costs one line: a console waiting
# for a command, rather than a menu of everything you own.
#
# This is a real interaction change, not a skin — if it annoys you, delete this
# line and the geometry above still stands on its own. gruvbox-crt keeps the
# list visible on open, which is the conventional and arguably friendlier
# behaviour, and that contrast is deliberate.
hide-before-typing=yes

# A rule above the prompt, and DELIBERATELY NOT A FAKE READOUT. The strongest
# finding in the cyberpunk-UI critiques is that ornament which looks like
# information gets read, and then punishes the reader for reading it — fake hex,
# fake paths, decorative [SYS::AUTH_OK]. Ornament has to be structurally legible
# AS ornament: rules, ticks, blocks. So this is a heavy horizontal rule and
# nothing else. Block-element codepoints, which every mono face covers; the
# box-drawing diagonals that would look more "cyberpunk" are exactly the kind of
# glyph that silently falls back to a different font.
message=━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
message-mode=wrap

# Honest UI text rather than atmosphere. It says what to do.
placeholder=filter

# THE ICON THEME HAS TWO HOMES AND ONLY ONE OF THEM IS THE THEME FILE.
# themes/neon-sprawl/icon-theme feeds gsettings and kdeglobals, which is what
# GTK and KDE apps read. fuzzel reads NEITHER — it takes its own icon-theme key,
# and this line said breeze-dark for as long as the Luv package existed, so the
# launcher stayed gruvbox-iconned while Dolphin changed. Keep the two in step by
# hand; nothing checks it.
icon-theme=Luv
icons-enabled=yes

# A real numeric readout — matches/total beside the prompt. The only kind of
# number this theme is allowed to show: it counts something. Decorative digits
# are the failure mode the cyberpunk-UI critiques converge on, because anything
# that looks like information gets read and then punishes the reader.
match-counter=yes

# `gamma-correct=yes` WAS HERE AND IS NOT A VALID OPTION IN THIS BUILD.
# fuzzel.ini(5) documents it, and also documents why it can be absent: "It is
# not possible to enable gamma-correct blending in cairo enabled builds of
# fuzzel", and Fedora's is one. Rejected outright — `not a valid option`.
# Left as a comment rather than deleted, so the next person to read the man page
# and think "that would help the cyan bloom" does not re-add it.

match-mode=fzf
show-actions=yes
terminal=kitty -e

# Type treatment, and deliberately restrained.
#
# POINTS, NOT PIXELS, AND NOT BY PREFERENCE. fuzzel's px branch parses with
# strtol — px values must be WHOLE NUMBERS, and `0.5px` is rejected outright
# with "invalid px value (must be on the form 12px)". The bare-number branch is
# a float and means points, which is the unit `font=…:size=11` is already in,
# so tracking stated here is em-relative to the type by construction and scales
# with the panel's DPI instead of being pinned to a pixel count.
#
# 0.5pt against size=11 is 0.045em — the low end of the 0.04–0.10em band that
# is useful for glanced labels, and deliberately the low end because this is a
# MONOSPACE face. On a mono face the word space is exactly one advance width,
# so inter-letter space starts competing with word boundaries sooner than it
# would on a proportional one, and losing word cohesion would cost the glance
# advantage the tracking was bought for.
#
# Caught by `fuzzel --check-config` before it reached the session. Without that
# flag fuzzel would have logged the bad line, skipped it, and started normally
# — so the symptom would have been no tracking and no explanation.
letter-spacing=0.5
# The selected row reads one weight up rather than relying on the accent fill
# alone — weight contrast is scale-invariant, which a 1px anything is not.
use-bold=yes

[colors]
# Darker and more opaque than gruvbox's f0 — this panel sits over a blurred
# wallpaper at anchor=top-left with real estate behind it, and a launcher you
# can read through is a launcher you cannot read.
background=070810f7
text=d7e0ffff
# The prompt is the ONE piece of chrome here that carries the accent, because
# "//RUN█" is a cursor and a cursor marks where you are — which is what the
# accent means. gruvbox's prompt is secondary-grey; this one is lit.
prompt=00e5ffff
placeholder=2a3048ff
input=d7e0ffff
match=00e5ffff
selection=00e5ffff
selection-text=0a0b10ff
selection-match=0a0b10ff
# The rule above the prompt. Ambient, not accent — it is a frame edge, and a
# frame that competes with the content is the failure this whole grammar is
# guarding against.
message=1e2130ff
# Restored — dropped by the hand-written version. The match counter is a real
# numeric readout rather than decorative digits, which is the only kind of
# number this theme is allowed to show.
counter=3a4160ff
border=00e5ffff

[border]
# 3px to match the window border weight in hypr.conf.
width=3
radius=0

# --- restored sections ------------------------------------------------------
# Both of these were missing entirely. They carry no colour and so were easy to
# forget, which is exactly why the parity diff exists.

[dmenu]
# hypr-cheatsheet, the wallpaper menu, the clipboard binding and
# `hypr-theme menu` all pipe through dmenu mode.
#
# `exit-immediately-if-empty`, NOT `exit-on-empty`. The latter is not a fuzzel
# option and never has been — it was in config/fuzzel/fuzzel.ini, so river's
# launcher has never had this behaviour either. fuzzel's forgiving parser
# logged `not a valid option: exit-on-empty` and carried on, which is why four
# months of use never revealed it. Name confirmed in fuzzel.ini(5) for 1.14.1.
exit-immediately-if-empty=yes

[key-bindings]
# vi keys, matching fish, neovim and the compositor — "same keybind vocabulary
# across machines" from 03-conventions/dotfiles.md.
#
# THE UNMAP LINE IS LOAD-BEARING AND MUST COME FIRST. fuzzel allows a key
# combination to map to exactly one action, and Control+k is a DEFAULT binding
# for delete-line-forward — so `prev=… Control+k` is rejected outright with
# "Control+k already mapped to 'delete-line-forward'". Because the parser
# checks each line against the map as it reads it, the unmap has to appear
# ABOVE the line that wants the key; below it is too late.
#
# This line was missing from config/fuzzel/fuzzel.ini too, so the whole `prev`
# binding has been rejected and skipped in BOTH sessions for as long as it has
# existed — leaving Up and Control+p at their defaults and Control+j unbound.
# The intended vi keys have never actually worked. Restoring the file's keys
# faithfully restored the defect with them; `fuzzel --check-config` is what
# finally said so out loud.
#
# The trade is deliberate: Control+k stops deleting to end of line. Control+u
# (delete-line-backward) and Control+Shift+BackSpace (delete-line) both remain.
delete-line-forward=none
prev=Up Control+p Control+k
next=Down Control+n Control+j
