# config/hypr/themes/neon-sprawl/fuzzel.ini
#
# Launcher, clipboard picker and the fuzzel-dmenu menus, neon-sprawl variant.
# Passed with `fuzzel --config=` from hyprland.conf's binds, so the RIVER
# session keeps ~/.config/fuzzel/fuzzel.ini and stays gruvbox (ADR-0026).
#
# Grammar per ADR-0021, re-instantiated: selection takes the accent, and
# nothing else is allowed to look like it.

font=JetBrains Mono:size=11
dpi-aware=auto
prompt="▚ run ❯ "
width=50
lines=14
horizontal-pad=18
vertical-pad=18
inner-pad=6
icon-theme=breeze-dark
icons-enabled=yes
match-mode=fzf
show-actions=yes
terminal=kitty -e

[colors]
background=0a0b10f0
text=d7e0ffff
prompt=7a86b8ff
placeholder=3a4160ff
input=d7e0ffff
match=00e5ffff
selection=00e5ffff
selection-text=0a0b10ff
selection-match=0a0b10ff
border=00e5ffff

[border]
width=2
radius=0
