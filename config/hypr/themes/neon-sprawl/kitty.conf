# config/hypr/themes/neon-sprawl/kitty.conf
#
# Terminal palette, neon-sprawl variant. Reached via KITTY_CONFIG_DIRECTORY,
# set for the HYPRLAND session only — the river session and any kitty started
# from Plasma keep ~/.config/kitty/kitty.conf and stay gruvbox (ADR-0026).
#
# The 16 ANSI colours are DATA, not chrome, and ADR-0021 already exempts
# kitty's palette from the "no aqua/green/blue" rule for exactly that reason:
# ls, git diff and htop mean things by them. So they stay a full, legible
# 16-colour set — shifted cool and raised in saturation to sit inside this
# theme, not flattened into two hues.

font_family      JetBrains Mono
enable_audio_bell no
scrollback_lines  10000

# Lower than gruvbox's 0.96: this session's blur is heavier (passes 4), so a
# more transparent terminal still reads as solid. hyprland.conf multiplies a
# further 0.88 on top, session-scoped.
background_opacity 0.92
dynamic_background_opacity yes

background            #0a0b10
foreground            #d7e0ff
cursor                #00e5ff
cursor_text_color     #0a0b10
selection_background  #1e2130
selection_foreground  #d7e0ff
url_color             #00e5ff

# black / red / green / yellow / blue / magenta / cyan / white
color0  #12141d
color1  #ff2e6c
color2  #4ee88f
color3  #ffb800
color4  #4d8dff
color5  #b026ff
color6  #00e5ff
color7  #7a86b8
# bright
color8  #3a4160
color9  #ff5c88
color10 #7dffb4
color11 #ffd166
color12 #7aa9ff
color13 #cc6bff
color14 #6bf2ff
color15 #d7e0ff

# THE MACHINE'S OWN SETTINGS. config/kitty/kitty.conf ends with
# `include ./local.conf`, linked from local/thinkpad/kitty-local.conf — the
# per-machine file that carries things like font_size for this 191 DPI panel.
#
# This file was hand-written and DROPPED THAT LINE (2026-08-26). The symptom
# was the scratchpad appearing taller and narrower: different font metrics
# mean a different cell grid, so a terminal sized in characters lands at a
# different shape. Nothing about the theme was wrong; a non-colour setting had
# simply gone missing — the same failure as the first swayosd.css and the
# first swaync.css, which is three hand-written files and three omissions.
#
# ${HOME} rather than ./local.conf: kitty resolves relative includes against
# the config directory, and this file is reached through
# KITTY_CONFIG_DIRECTORY pointing at ~/.local/state/hypr-theme/live — so a
# relative path would look for local.conf in the state directory, not in
# ~/.config/kitty. Verify with `kitty --debug-config | grep font_size`.
include ${HOME}/.config/kitty/local.conf

# Tab bar, matching the bar's HUD treatment: lit from below, not filled.
tab_bar_style           powerline
tab_powerline_style     angled
active_tab_background   #12141d
active_tab_foreground   #00e5ff
inactive_tab_background #0a0b10
inactive_tab_foreground #3a4160
