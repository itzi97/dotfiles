# config/hypr/themes/neon-sprawl/kitty.conf
#
# Terminal palette, neon-sprawl variant. Reached via KITTY_CONFIG_DIRECTORY,
# set for the HYPRLAND session only — the river session and any kitty started
# from Plasma keep ~/.config/kitty/kitty.conf and stay gruvbox (ADR-0026).
#
# The 16 ANSI colours are DATA, not chrome, and ADR-0021 already exempts
# kitty's palette from the "no aqua/green/blue" rule for exactly that reason:
# ls, git diff and htop mean things by them. So they stay a full, legible
# 16-colour set — shifted cool and raised in saturation to sit inside this
# theme, not flattened into two hues.

# Adwaita Mono, matching every other surface this theme owns — Iosevka-derived,
# so narrower cells and more terminal in the same width, which suits a theme
# whose brief is "too many signs". Verified installed with `fc-list :spacing=100`
# rather than assumed: fontconfig never errors on a missing family, it silently
# substitutes, so a wrong name looks exactly like a setting that did not apply.
# Box drawing and powerline separators are drawn by kitty itself, not taken from
# the font, so a narrower face costs nothing there.
font_family      Adwaita Mono
enable_audio_bell no
scrollback_lines  10000

# --- terminal character, not just terminal colours -------------------------
# The palette below was fully cyberpunk from the first pass and everything
# around it was gruvbox's kitty with different numbers. These are the shape.

# A blinking block in the accent. gruvbox's kitty leaves the cursor at kitty's
# defaults, which is a non-blinking block — so this is a difference you see
# every second rather than one you have to go looking for. 0.6s is slow enough
# to read as a pulse rather than a flicker; kitty stops it after 15s of
# inactivity by default, so it does not burn battery on an idle terminal.
cursor_shape      block
cursor_blink_interval 0.6

# Room to breathe. The session's spacing unit is multiples of 3 and this theme
# uses the larger end of it everywhere else — 16px gaps, 28px launcher padding.
# A terminal packed to its own border is the one surface that was still tight.
window_padding_width 8 10

# Tabs along the TOP edge, tucked under the bar, so the terminal reads
# top-anchored like every other surface in this theme — the launcher at
# anchor=top-left, the bar's lit bottom edge, the OSD's bracket. gruvbox keeps
# kitty's default bottom edge.
tab_bar_edge      top
active_tab_font_style   bold
inactive_tab_font_style normal

# Dotted underline on URLs, in the accent already set below. A solid underline
# is a link; a dotted one is a machine telling you it found something.
url_style         dotted

# Lower than gruvbox's 0.96: this session's blur is heavier (passes 4), so a
# more transparent terminal still reads as solid. hyprland.conf multiplies a
# further 0.88 on top, session-scoped.
background_opacity 0.92
dynamic_background_opacity yes

background            #0a0b10
foreground            #d7e0ff
cursor                #00e5ff
cursor_text_color     #0a0b10
selection_background  #1e2130
selection_foreground  #d7e0ff
url_color             #00e5ff

# black / red / green / yellow / blue / magenta / cyan / white
color0  #12141d
color1  #ff2e6c
color2  #4ee88f
color3  #ffb800
color4  #4d8dff
color5  #b026ff
color6  #00e5ff
color7  #7a86b8
# bright
color8  #3a4160
color9  #ff5c88
color10 #7dffb4
color11 #ffd166
color12 #7aa9ff
color13 #cc6bff
color14 #6bf2ff
color15 #d7e0ff

# THE MACHINE'S OWN SETTINGS. config/kitty/kitty.conf ends with
# `include ./local.conf`, linked from local/thinkpad/kitty-local.conf — the
# per-machine file that carries things like font_size for this 191 DPI panel.
#
# This file was hand-written and DROPPED THAT LINE (2026-08-26). The symptom
# was the scratchpad appearing taller and narrower: different font metrics
# mean a different cell grid, so a terminal sized in characters lands at a
# different shape. Nothing about the theme was wrong; a non-colour setting had
# simply gone missing — the same failure as the first swayosd.css and the
# first swaync.css, which is three hand-written files and three omissions.
#
# ${HOME} rather than ./local.conf: kitty resolves relative includes against
# the config directory, and this file is reached through
# KITTY_CONFIG_DIRECTORY pointing at ~/.local/state/hypr-theme/live — so a
# relative path would look for local.conf in the state directory, not in
# ~/.config/kitty.
#
# THE VERIFICATION COMMAND THAT USED TO BE ON THIS LINE DOES NOT EXIST.
# It said `kitty --debug-config | grep font_size`, and kitty answers that with
# `Unknown flag: --debug-config use --help.` (2026-08-27). That is worse than no
# advice: it sits in the comment block written ABOUT this exact bug — the
# hand-written kitty.conf that dropped the include and changed the scratchpad's
# shape — and offers a check that errors, which reads as "the tooling is broken"
# rather than "the claim was never tested".
#
# TWO CHECKS, because no single one covers both halves — and the first draft of
# this comment claimed one did, which is the same mistake in miniature.
#
#   kitty --debug-font-fallback true 2>&1 | head -20
#     Confirms font_family. Prints the resolved family and the .ttf path for
#     Normal/Bold/Italic/Bold-Italic. It prints NO SIZE, so it says nothing
#     about the include below.
#
#   kitty --config ~/.config/hypr/themes/neon-sprawl/kitty.conf true 2>&1 | head
#     Confirms the include. kitty warns on an include it cannot read, so silence
#     means it resolved and a "Failed to read from include file" naming a literal
#     ${HOME} means the expansion did not happen.
#
# SETTLED 2026-08-27: the include resolves and ${HOME} expands.
#
# This line uses ${HOME} rather than ./local.conf because relative includes
# resolve against KITTY_CONFIG_DIRECTORY, which points at the theme directory —
# so ./local.conf would look in ~/.local/state/hypr-theme/live/ and find nothing.
# That reasoning holds only if kitty expands ${HOME} in an include path, which
# was assumed rather than checked when the line was written.
#
# Checked properly, with a NEGATIVE CONTROL, because silence from the command
# above proves nothing unless the command is capable of failing:
#
#     printf 'include ${HOME}/.config/kitty/nope.conf\n' > /tmp/t.conf
#     kitty --config /tmp/t.conf true 2>&1 | head
#     -> Could not find included config file:
#        /home/itziar/.config/kitty/nope.conf, ignoring
#
# Two facts from one line. kitty DOES warn on a missing include, so the real
# config's silence means it resolved. And the warning prints the path ALREADY
# EXPANDED, which is direct proof that ${HOME} works rather than an inference
# from the absence of an error.
#
# Worth keeping as a pattern: a check that cannot fail is not a check. This whole
# file exists because a silent no-op looked exactly like success.
include ${HOME}/.config/kitty/local.conf

# Tab bar, matching the bar's HUD treatment: lit from below, not filled.
tab_bar_style           powerline
tab_powerline_style     angled
active_tab_background   #12141d
active_tab_foreground   #00e5ff
inactive_tab_background #0a0b10
inactive_tab_foreground #3a4160
