# ~/.config/fuzzel/fuzzel.ini
#
# Launcher for the river session, and the menu behind river-cheatsheet,
# river-wallpaper and the clipboard history binding.
#
# gruvbox dark, matching waybar, kitty, neovim, zathura and river's borders.
# Colours are RRGGBBAA — the trailing pair is alpha, which fuzzel requires.

font=JetBrainsMono Nerd Font:size=11
dpi-aware=auto

# Roughly a third of a 1080p screen. Wide enough for long paths in the
# wallpaper picker and the cheat sheet, narrow enough not to cover the work.
width=45
lines=12
horizontal-pad=20
vertical-pad=14
inner-pad=8

# Show application icons in the launcher. A Nerd Font is installed and the
# icon theme comes from the KDE spin, so both halves of this work.
icon-theme=breeze-dark
icons-enabled=yes

# Fuzzy matching, because remembering the start of a name is the hard part.
match-mode=fzf
show-actions=yes
terminal=kitty -e

[colors]
# bg0 with a little transparency — the compositor has no blur (river has no
# effects pipeline), so this stays subtle. Anything more and text over a busy
# wallpaper becomes hard to read, which defeats the point of a launcher.
background=282828f0
text=ebdbb2ff
prompt=a89984ff
placeholder=928374ff
input=ebdbb2ff

# Match highlighting in gruvbox yellow — the same accent as the focused
# window border and the focused waybar tag, so "this is selected" means the
# same colour everywhere in the session.
match=fabd2fff
selection=504945ff
selection-text=ebdbb2ff
selection-match=fe8019ff

counter=928374ff
border=d79921ff

[border]
width=2
radius=0

[dmenu]
# river-cheatsheet and river-wallpaper both pipe through dmenu mode.
exit-on-empty=yes

[key-bindings]
# vi keys, matching fish, neovim and river itself — "same keybind vocabulary
# across machines" from 03-conventions/dotfiles.md.
prev=Up Control+p Control+k
next=Down Control+n Control+j
