# ~/.config/fuzzel/fuzzel.ini
#
# Launcher for the river session, and the menu behind river-cheatsheet,
# river-wallpaper and the clipboard history binding.
#
# gruvbox dark, colour grammar per ADR-0021: #d79921 means selected/focused/
# current, everywhere in the session. Colours are RRGGBBAA — the trailing
# pair is alpha, which fuzzel requires.

font=JetBrains Mono:size=11
dpi-aware=auto

# The one surface allowed to read a step larger than the bar's 13px: it holds
# the keyboard focus whenever it exists, and that is the hierarchy. Prompt
# follows the picker convention ("<glyph> <noun> ❯") — the launcher is the
# run picker (second-feedback 2026-08-25: it read as too plain).
prompt="󰌽 run ❯ "

# width is in CHARACTERS, not pixels. 50ch at size 11 is wide enough for long
# names, narrow enough not to cover the work. The pickers (cheat sheet,
# wallpaper, clipboard) override to 64ch on the command line — their content
# is two columns, not one name.
width=50
lines=14

# Spacing rhythm (ADR-0021): multiples of 3 — 18 breathes on the focus
# surface, matching its one-step-larger type.
horizontal-pad=18
vertical-pad=18
inner-pad=6

# Show application icons in the launcher. A Nerd Font is installed and the
# icon theme comes from the KDE spin, so both halves of this work.
icon-theme=breeze-dark
icons-enabled=yes

# Fuzzy matching, because remembering the start of a name is the hard part.
match-mode=fzf
show-actions=yes
terminal=kitty -e

[colors]
# bg0 with a little transparency — the compositor has no blur (river has no
# effects pipeline), so this stays subtle. Anything more and text over a busy
# wallpaper becomes hard to read, which defeats the point of a launcher.
background=282828f0
text=ebdbb2ff
prompt=a89984ff
placeholder=928374ff
input=ebdbb2ff

# THE SELECTION IS THE ACCENT. Same ink as the focused window border, the
# focused waybar tag and kitty's active tab: dark text on #d79921. The old
# config had a bg2 selection and called fabd2f "the same accent as the
# window border", which it is not — that second yellow is retired from
# chrome entirely.
#
# match is also d79921: the highlighted characters are the CURRENT query
# echoed back, and "current" is what the accent means. On the selected row
# they share the selection-text colour deliberately — that row is already
# chosen; the highlight has finished its job there.
match=d79921ff
selection=d79921ff
selection-text=282828ff
selection-match=282828ff

counter=928374ff
border=d79921ff

[border]
# 2px, like every chrome edge in the session. Accent rather than bg2 because
# an open launcher always holds the keyboard focus — the same statement the
# focused window border makes.
width=2
radius=0

[dmenu]
# river-cheatsheet, river-wallpaper and the clipboard binding pipe through
# dmenu mode. Their prompts follow one convention: "<glyph> <noun> ❯ ".
#
# WAS `exit-on-empty=yes`, WHICH IS NOT A FUZZEL OPTION (corrected 2026-08-27).
# fuzzel's parser skips an unrecognised key with a log line and starts anyway,
# so this silently did nothing for as long as it has been here. Found only
# because `fuzzel --check-config` turns those log lines fatal, and that was
# only run because the Hyprland theme copied this file's keys verbatim.
# Correct name per fuzzel.ini(5), 1.14.1.
#
# BEHAVIOUR CHANGE, named rather than slipped in: with this actually in effect,
# a dmenu picker given empty stdin now exits silently instead of opening an
# empty window. That is what the line was always asking for. To go back, delete
# it — do not restore the old spelling, which only ever bought the default.
exit-immediately-if-empty=yes

[key-bindings]
# vi keys, matching fish, neovim and river itself — "same keybind vocabulary
# across machines" from 03-conventions/dotfiles.md.
#
# THE UNMAP LINE IS LOAD-BEARING AND MUST COME FIRST (added 2026-08-27).
# fuzzel allows a key combination to map to exactly one action, and Control+k
# is a DEFAULT binding for delete-line-forward — so `prev=… Control+k` was
# rejected with "Control+k already mapped to 'delete-line-forward'", and the
# whole line skipped. The parser checks each line against the map as it reads
# it, so the unmap must appear ABOVE the line that wants the key.
#
# CONSEQUENCE WORTH SAYING PLAINLY: this binding has never worked. Up and
# Control+p kept their defaults, Control+k kept deleting to end of line, and
# Control+j did nothing at all. Every use of this launcher since the line was
# written has been on fuzzel's defaults. Found by `fuzzel --check-config`,
# which is now the thing to run after any edit here — fuzzel's own log line
# goes to stderr under a keybind, where nobody reads it.
#
# The trade is deliberate: Control+k stops deleting to end of line. Control+u
# (delete-line-backward) and Control+Shift+BackSpace (delete-line) both remain.
delete-line-forward=none
prev=Up Control+p Control+k
next=Down Control+n Control+j
