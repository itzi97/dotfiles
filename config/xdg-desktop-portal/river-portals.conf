# ~/.dotfiles/config/xdg-desktop-portal/river-portals.conf
#
# Linked to ~/.config/xdg-desktop-portal/river-portals.conf.
#
# xdg-desktop-portal picks its backend by XDG_CURRENT_DESKTOP. That value does
# NOT come from config/river/init — an earlier version of this comment said it
# did, and it was wrong. river-classic's session file supplies it:
#
#   /usr/share/wayland-sessions/river.desktop: DesktopNames=river;wlroots
#
# so the value in effect is `river;wlroots`. The portal searches for a config
# per name, which is why this file is river-portals.conf. Fedora ships
# sway-portals.conf and hyprland-portals.conf but no river one, because
# river-classic is not a distro-blessed session; with no matching file the
# portal falls back per interface and logs "as a last-resort fallback".
#
# wlr.portal declares:
#   UseIn=wlroots;sway;Wayfire;river;phosh;Hyprland;
# so it is a legitimate candidate under either name. Verified 2026-08-24.
#
# wlr for capture, gtk for everything else. xdg-desktop-portal-gtk has no
# ScreenCast implementation on wlroots — pointing capture at it is how you get
# a screen share that connects and shows a black rectangle.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
