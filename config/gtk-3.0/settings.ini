# ~/.config/gtk-3.0/settings.ini
#
# GTK apps in the river session: nm-applet's wifi menu, blueman, every
# file-picker dialog, swaync's panel.
#
# WITHOUT THIS FILE they render in light Adwaita — bright white popups over a
# dark desktop, which is the single most jarring break in an otherwise
# consistent session. Plasma was setting this for you; river sets nothing.
#
# Adwaita-dark rather than a gruvbox GTK theme, deliberately: gruvbox GTK
# themes are not in Fedora's repos, and an unpackaged theme dropped into
# ~/.themes is exactly the kind of unmanaged, un-updated thing this stack
# avoids (see ADR-0016 on hand-installed software). Adwaita-dark is dark,
# maintained, in-repo, and neutral enough to sit beside gruvbox without
# fighting it. Close, not exact — a deliberate trade.
#
# NOTE: GTK4 apps ignore this file for the *theme* — they use libadwaita and
# follow the colour-scheme preference instead. That is set via gsettings in
# config/river/init; both are needed.

[Settings]
gtk-theme-name=Adwaita-dark
gtk-application-prefer-dark-theme=true

# Breeze icons come from the KDE spin and are already installed. Keeping them
# means GTK and Qt apps show the same icon set.
gtk-icon-theme-name=breeze-dark
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24

gtk-font-name=Cantarell 11

# Dialogs get a usable amount of history and no thumbnails over the network.
gtk-recent-files-max-age=30
gtk-enable-animations=true
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
