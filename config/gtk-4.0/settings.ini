# ~/.config/gtk-4.0/settings.ini
#
# GTK4/libadwaita apps mostly ignore gtk-theme-name — they follow the
# colour-scheme preference, which config/river/init sets via gsettings:
#
#     gsettings set org.gnome.desktop.interface color-scheme prefer-dark
#
# This file still matters for the settings libadwaita DOES read: icons,
# cursor, font, and the dark preference itself as a fallback for anything
# reading settings.ini directly rather than through the portal.
#
# Kept in step with gtk-3.0/settings.ini deliberately. Two GTK versions with
# different icon themes looks like a bug even when it isn't.

[Settings]
gtk-application-prefer-dark-theme=true
gtk-icon-theme-name=breeze-dark
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-font-name=Cantarell 11
gtk-enable-animations=true
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
