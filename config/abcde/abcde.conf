# ~/.abcde.conf  (linked from ~/.dotfiles/config/abcde/abcde.conf)
#
# Carried over VERBATIM from the old stow repo (itzi97/dotfiles), per ADR-0009
# reason #4: don't mix a migration with a rewrite. An earlier draft of this file
# in the starter repo had "improved" it and broke the workflow — see below.
#
# DO NOT remove getalbumart/embedalbumart from ACTIONS.
#   rip-cd.fish does no cover-art handling whatsoever — it only calls eyeD3 for
#   text frames. Cover art comes entirely from abcde. Dropping those two actions
#   silently produces an art-less library, which is exactly the failure ADR-0009's
#   verification criterion ("...with cover art embedded") exists to catch.
#
# DO NOT remove 'clean' from ACTIONS.
#   Nothing else cleans the abcde working directory. rip-cd only does
#   `find "$STAGING" -type d -empty -delete` — it never touches abcde.*/.
#
# Path contract with rip-cd.fish:
#   OUTPUTDIR  $HOME/Music/staging   -> rip-cd picks up new flat MP3s from here
#   final home $HOME/Music/mp3/<Artist>/<Year> - <Album>/   (created by rip-cd)
# Neither directory exists yet — the workflow has never been run end to end.

OUTPUTTYPE="mp3"
OUTPUTDIR="$HOME/Music/staging"

MP3ENCODERSYNTAX=lame
LAME=lame
LAMEOPTS='-b 320 -q 0'

CDDBMETHOD=musicbrainz
# tag kept: abcde writes basic ID3 tags so rip-cd fast path can read them back
ACTIONS=cddb,read,encode,tag,move,clean,getalbumart,embedalbumart

PADTRACKS=y
CDPARANOIA=cdparanoia
GETCOVER=y
COVERFILE=cover.jpg
# Do not prompt for art URL — use whatever was fetched automatically
INTERACTIVECOVER=n
EJECTCD=y
MAXPROCS=2

# Flat staging output — fish script handles final folder structure
OUTPUTFORMAT='${OUTPUT}/${TRACKNUM} - ${TRACKFILE}'
VAOUTPUTFORMAT='${OUTPUT}/${TRACKNUM} - ${ARTISTFILE} - ${TRACKFILE}'

mungefilename () {
    echo "$@" | sed 's|[\\/]|-|g' | sed 's/:/-/g' | sed 's/  */ /g' | tr -d '"?\001-\037\177'
}

mungealbumname () {
    echo "$1" | sed 's/:/ - /g' | sed 's|[\\/]|-|g' | sed 's/  */ /g' | tr -d '"?\001-\037\177'
}

mungeartistname () {
    echo "$1" | sed 's|[\\/]|-|g' | sed 's/  */ /g' | tr -d '"?\001-\037\177'
}

mungetrackname () {
    echo "$1" | sed 's|[\\/]|-|g' | sed 's/  */ /g' | tr -d '"?\001-\037\177'
}
