# Shared kitty config. Machine-specific values go in local.conf, which
# dotbot links per machine. This include is native kitty behaviour, so it
# keeps working with or without a dotfile manager.

font_family      JetBrains Mono
enable_audio_bell no
scrollback_lines  10000

# --- transparency ----------------------------------------------------------
# Needs a compositor; KWin provides one (ADR-0002).
#
# 0.96 — a hint of the desktop showing through rather than a real window into
# it. Deliberately restrained: KWin won't blur kitty (kitty doesn't request it
# on Wayland, and forcing it needs a third-party KWin effect that breaks on
# Plasma updates — rejected 2026-08-18), so anything more transparent means
# reading code over an unblurred wallpaper.
background_opacity 0.96

# Allows live adjustment with ctrl+shift+a then > / < — useful for turning
# transparency off temporarily when screen-sharing or working outdoors.
dynamic_background_opacity yes

# --- gruvbox dark ----------------------------------------------------------
# Same palette as neovim (lua/plugins/ui.lua) and zathura (zathurarc), so the
# light level doesn't jump when moving between them.
background            #282828
foreground            #ebdbb2
# Amber block cursor — the most phosphor-terminal statement a terminal can
# make, and pure ADR-0021 grammar: the cursor is the CURRENT position, and
# current is what the accent means. Shared file, so every machine gets it.
cursor                #d79921
cursor_text_color     #1d2021

selection_background  #504945
selection_foreground  #ebdbb2

url_color             #83a598

# normal
color0  #282828
color1  #cc241d
color2  #98971a
color3  #d79921
color4  #458588
color5  #b16286
color6  #689d6a
color7  #a89984

# bright
color8  #928374
color9  #fb4934
color10 #b8bb26
color11 #fabd2f
color12 #83a598
color13 #d3869b
color14 #8ec07c
color15 #ebdbb2

# Tab bar, so it doesn't stay default-blue against gruvbox.
active_tab_background   #d79921
active_tab_foreground   #282828
inactive_tab_background #3c3836
inactive_tab_foreground #a89984

# Machine-specific overrides (font size, DPI, etc). Must come last.
include ./local.conf
