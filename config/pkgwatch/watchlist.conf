# pkgwatch — software that no package manager will ever update for you.
#
# Format:   name | download-url | rpm-package-name (optional)
#           Whitespace around the pipes is trimmed, so align them for readability.
#
# The URL should point at the actual artefact (the .rpm / .AppImage), not a
# landing page. pkgwatch sends a HEAD request and watches ETag / Last-Modified /
# Content-Length — it never parses HTML, so a page redesign can't silently break it.
#
# The third field is optional and only used to print the currently installed
# version alongside the result, so the report answers "is there something new"
# and "what have I got" in one line.
#
# Add anything installed by download rather than by a repo. If it came from dnf,
# flatpak or a vendor repo, it does NOT belong here — those update themselves,
# and a watchlist full of things that don't need watching is a watchlist you
# stop reading.

# --- Tier A under ADR-0016: vaults and TOTP, vendor build only ---------
# These are the reason this script exists. Both are hand-downloaded RPMs with
# no repo behind them; nothing else will tell you a new version shipped.
ProtonPass          | https://proton.me/download/PassDesktop/linux/x86_64/ProtonPass.rpm | proton-pass

# Proton Authenticator: paste the exact .rpm URL from
#   https://proton.me/authenticator/download
# pkgwatch reports UNKNOWN and exits non-zero until this is filled in — that is
# deliberate, so a half-configured watchlist can't look like a passing check.
ProtonAuthenticator | REPLACE_ME | proton-authenticator

# --- Not watched, on purpose ------------------------------------------
# ProtonMail   -> Flathub me.proton.Mail, auto-updates (ADR-0016 Tier B)
# ProtonVPN    -> protonvpn-fedora-stable repo, auto-updates
# Ankama       -> Gear Lever manages the AppImage and checks for updates itself
