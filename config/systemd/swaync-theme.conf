# Drop-in for the packaged swaync.service.
# Linked to ~/.config/systemd/user/swaync.service.d/theme.conf
#
# Documentation=file:///home/itziar/Documents/00_Claude_Spaces/personal-stack-space/05-decisions/0026-two-session-themes-for-hyprland.md
#
# WHY THIS OVERRIDE EXISTS. Fedora's SwayNotificationCenter package enables
# swaync.service with a bare `ExecStart=/usr/bin/swaync`, and bin/hypr-theme
# ALSO started swaync with the theme's stylesheet. Two owners; systemd's
# untheme d copy won every time, because `hypr-theme set` killed swaync and
# systemd restarted its own — while the copy hypr-theme spawned aborted trying
# to take the D-Bus name the dying one still held. A bare swaync loads
# ~/.config/swaync/style.css, the shared GRUVBOX file, so notifications stayed
# gruvbox while every other surface changed (found 2026-08-27).
#
# systemd is now the single owner. hypr-theme calls
# `systemctl --user restart swaync.service`, which serialises stop-then-start,
# so the D-Bus race is removed rather than slept through.

[Service]
# The empty assignment is REQUIRED and is not a typo. ExecStart is a list-typed
# directive: without clearing it first this line APPENDS a second command
# rather than replacing the packaged one, and the packaged unit is Type=dbus,
# which permits exactly one ExecStart. Clearing then setting is the documented
# pattern for overriding it from a drop-in.
ExecStart=
ExecStart=%h/.local/bin/swaync-themed

# DELIBERATELY NOT OVERRIDDEN, and each for a reason:
#
#   ExecReload=  swaync-client --reload-config ; --reload-css. It re-reads the
#                stylesheet swaync was STARTED with, so it cannot switch theme
#                — but `systemctl --user reload swaync.service` is the cheap
#                way to apply an edit to the CURRENT theme's swaync.css with
#                no restart and no dropped notifications.
#   Type=dbus / BusName=  the reason two owners could never coexist: the second
#                copy calls error("Could not acquire swaync name!"), which is
#                Vala's error() -> g_error() -> abort. That is the "Aborted
#                (core dumped)" of 2026-08-26, wrongly blamed on a stylesheet.
#   Restart=on-failure  which is what silently resurrected the untheme d copy
#                every time hypr-theme killed it.
